<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">

<style>
:root{color-scheme:light}body{margin:0;background:#F2F4F7;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Thai",sans-serif;color:#101828}
.lk{min-height:100vh;display:grid;place-items:center;padding:16px}.bx{background:#fff;border-radius:16px;box-shadow:0 10px 40px rgba(16,24,40,.12);padding:28px;max-width:380px;width:100%}
h1{font-size:20px;margin:0 0 4px}p{margin:0 0 14px;color:#475467;font-size:14px;line-height:1.5}label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
input[type=password],input[type=text]{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:11px 12px;border:1px solid #D0D5DD;border-radius:10px}
.ck{display:flex;gap:8px;align-items:center;font-size:13.5px;margin-top:12px;color:#344054}button{margin-top:16px;width:100%;font:inherit;font-weight:700;font-size:15px;padding:12px;border:0;border-radius:10px;background:#C54826;color:#fff;cursor:pointer}
button:disabled{opacity:.6}.er{color:#B42318;font-size:13px;font-weight:600;margin-top:10px;min-height:18px}.ft{font-size:11.5px;color:#98A2B3;margin-top:14px}
</style></head><body>
<div class="lk"><form class="bx" id="f" autocomplete="off"><h1>HeartWork Repair Tracker</h1><p>ข้อมูลภายในของทีม After-sales · ใส่รหัสทีมเพื่อเปิดดู ลงนัดเข้าซ่อม และนำเข้าไฟล์</p>

<label for="nm">ชื่อที่แสดงเมื่อลงนัดหรือนำเข้าไฟล์ (ไม่บังคับ)</label><input type="text" id="nm" maxlength="40" placeholder="เช่น ฝน CS">
<label class="ck"><input type="checkbox" id="rm" checked> จำรหัสบนเครื่องนี้ (ไม่ต้องใส่ซ้ำ)</label>
<button type="submit" id="go">เปิดแดชบอร์ด</button><div class="er" id="er" role="alert"></div>
<div class="ft">ข้อมูลในหน้านี้เข้ารหัสไว้ คนที่ไม่มีรหัสทีมจะอ่านไม่ได้ · อย่าส่งรหัสให้คนนอกทีม</div></form></div>
<script>
var CFG={"apiKey": "AIzaSyA7d02406W0a-YyEVmk51AVdQNgAlM2HvA", "authDomain": "heartwork-repair.firebaseapp.com", "projectId": "heartwork-repair", "storageBucket": "heartwork-repair.firebasestorage.app", "messagingSenderId": "1036542914986", "appId": "1:1036542914986:web:e242a69ecd601c82fafbd3"},KW={"salt": "OLJbwz4QMoyCIzX8VNw8FA==", "iter": 310000, "iv": "9BcY5AdHRhKFP2c5", "wk": "wTVz1NgN6MgO9lDMaKdtJHrhCxb24zU5bxIPLhoWdT0Eo/pSMCUX2iVuZOtA/T9m"};
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function hex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(x){return('0'+x.toString(16)).slice(-2)}).join('')}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
var E=new TextEncoder(),S=crypto.subtle;
function derive(pw){return S.importKey('raw',E.encode(pw),'PBKDF2',false,['deriveKey']).then(function(k){return S.deriveKey({name:'PBKDF2',salt:b64(KW.salt),iterations:KW.iter,hash:'SHA-256'},k,{name:'AES-GCM',length:256},true,['decrypt'])})}
function pathOf(pw){return S.digest('SHA-256',E.encode('hw-fs|'+pw)).then(hex)}

function openWith(w,path,remember){var er=document.getElementById('er');
  return unwrap(w).then(function(K){return fetch('d.json?v='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('net');return r.json()}).then(function(D){
    return S.decrypt({name:'AES-GCM',iv:b64(D.iv)},K,b64(D.ct)).then(function(pt){return new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}).then(function(html){
      if(remember){S.exportKey('raw',w).then(function(r){ls('hw-k',btoa(String.fromCharCode.apply(null,new Uint8Array(r))));ls('hw-p',path)})}
      var boot='<script>window.__HWFS='+JSON.stringify({cfg:CFG,path:path})+';<\/script><script>'+"/* HeartWork on GitHub Pages: stands in for the claude.ai runtime (claude.use('db'|'user')) using Firebase Firestore.\n   Everything lives under hw/<pathHash>/<collection>/<doc>; the rules only allow that exact hash (derived from the team password). */\n(function(){\n  var C=window.__HWFS||{};var dbP=null,userObj=null;\n  function load(src){return new Promise(function(ok,no){var s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}\n  function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}\n  function myId(){var id=ls('hw-uid');if(!id){id='g_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);ls('hw-uid',id)}return id}\n  function myName(){return ls('hw-uname')||''}\n  function getDb(){if(dbP)return dbP;var V='10.12.2';\n    dbP=load('https://www.gstatic.com/firebasejs/'+V+'/firebase-app-compat.js').then(function(){return load('https://www.gstatic.com/firebasejs/'+V+'/firebase-firestore-compat.js')}).then(function(){\n      var app=firebase.apps.length?firebase.app():firebase.initializeApp(C.cfg);var fs=firebase.firestore(app);try{fs.settings({ignoreUndefinedProperties:true,merge:true})}catch(e){}var base='hw/'+C.path+'/';\n      function wrapSnap(s){return {metadata:s.metadata,docs:s.docs.map(function(d){return {id:d.id,exists:d.exists,data:function(){return d.data()}}})}}\n      var api={collection:function(c){var ref=fs.collection(base+c);return {onSnapshot:function(f,e){return ref.onSnapshot({includeMetadataChanges:false},function(s){f(wrapSnap(s))},e||function(){})},\n          get:function(){return ref.get().then(wrapSnap)}}},\n        doc:function(p){var ref=fs.doc(base+p);return {set:function(d){return ref.set(d)},update:function(d){return ref.set(d,{merge:true})},get:function(){return ref.get().then(function(d){return {id:d.id,exists:d.exists,data:function(){return d.data()}}})},'delete':function(){return Promise.reject(new Error('delete disabled'))}}}};\n      // register my display name so others see who booked / imported\n      var n=myName();if(n)fs.doc(base+'who/'+myId()).set({name:n.slice(0,40),at:new Date().toISOString()},{merge:true}).catch(function(){});\n      return api}).catch(function(){return null});\n    return dbP}\n  var names={};\n  function user(){if(userObj)return userObj;userObj={\n    id:function(){return Promise.resolve(myId())},me:function(){return Promise.resolve({id:myId(),name:myName()})},\n    isOwner:function(){return Promise.resolve(true)},canEdit:function(){return Promise.resolve(true)},can:function(){return Promise.resolve(true)},\n    profiles:function(ids){return getDb().then(function(db){if(!db)return {};var out={},need=[];(ids||[]).forEach(function(i){if(names[i]!=null)out[i]={id:i,name:names[i]};else need.push(i)});\n      if(!need.length)return out;return db.collection('who').get().then(function(s){s.docs.forEach(function(d){names[d.id]=(d.data()||{}).name||''});(ids||[]).forEach(function(i){out[i]={id:i,name:names[i]||''}});return out},function(){return out})})},\n    search:function(){return Promise.resolve([])}};return userObj}\n  window.claude={use:function(k){if(k==='db')return getDb();if(k==='user')return Promise.resolve(user());return Promise.resolve(null)}};\n})();\n"+'<\/script>'+
        '<script>document.addEventListener("DOMContentLoaded",function(){var b=document.createElement("button");b.type="button";b.textContent="🔒 ล็อก";b.title="ล้างรหัสที่จำไว้บนเครื่องนี้";b.style.cssText="position:fixed;right:12px;bottom:12px;z-index:90;border:1px solid #D0D5DD;background:#fff;border-radius:999px;padding:6px 12px;font:13px system-ui;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12)";b.onclick=function(){try{localStorage.removeItem("hw-k");localStorage.removeItem("hw-p")}catch(e){}location.reload()};document.body.appendChild(b)})<\/script>';
      document.open();document.write('<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><\/head><body>'+boot+html+'<\/body><\/html>');document.close()})})})}
var saved=ls('hw-k'),sp=ls('hw-p');
if(saved&&sp){S.importKey('raw',b64(saved),'AES-GCM',true,['decrypt']).then(function(w){return openWith(w,sp,false)}).catch(function(){ls('hw-k',null);ls('hw-p',null)})}
document.getElementById('nm').value=ls('hw-uname')||'';
var tries=0;
document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();var pw=document.getElementById('pw').value,er=document.getElementById('er'),go=document.getElementById('go');if(!pw)return;
  var nm=document.getElementById('nm').value.trim();if(nm)ls('hw-uname',nm);go.disabled=true;er.textContent='กำลังเปิด…';
  Promise.all([derive(pw),pathOf(pw)]).then(function(r){return openWith(r[0],r[1],document.getElementById('rm').checked)}).catch(function(x){go.disabled=false;tries++;
    er.textContent=(x&&x.message==='net')?'โหลดข้อมูลไม่ได้ · ตรวจอินเทอร์เน็ตแล้วลองใหม่':'รหัสไม่ถูกต้อง';if(tries>=5){go.disabled=true;er.textContent='ใส่รหัสผิดหลายครั้ง · รอ 30 วินาที';setTimeout(function(){go.disabled=false;tries=0;er.textContent=''},30000)}})});
</script></body></html>
